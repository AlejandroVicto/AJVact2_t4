<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${nombreCine}">Cartelera de Películas</title>
    <link rel="stylesheet" th:href="@{/css/peliculas.css}">
</head>
<body>
    <!-- Título con @Value inyectado desde application.properties -->
    <h1 th:text="${nombreCine}">Cinemax Oaxaca - Alejandro Jimenez</h1>

    <!-- Mensaje si se agregó una película -->
    <p th:if="${mensajeExito != null}" class="mensaje" th:text="${mensajeExito}"></p>

    <!-- Filtro con @RequestParam -->
    <h3>Filtrar por Género</h3>
    <form th:action="@{/peliculas/cartelera}" method="get">
        <input type="text" name="genero" th:value="${generoFiltro}" placeholder="Ej. Accion, Drama">
        <button type="submit">Filtrar</button>
        <a th:href="@{/peliculas/cartelera}">Mostrar todas</a>
    </form>

    <!-- Tabla de Películas -->
    <h2>Películas en Cartelera</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Director</th>
                <th>Género</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="peli : ${peliculas}">
                <td th:text="${peli.id}"></td>
                <td th:text="${peli.titulo}"></td>
                <td th:text="${peli.director}"></td>
                <td th:text="${peli.genero}"></td>
                <td>
                    <a th:href="@{/peliculas/detalle/{id}(id=${peli.id})}">Ver detalle</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(peliculas)}">
                <td colspan="5">No se encontraron películas para este género.</td>
            </tr>
        </tbody>
    </table>

    <hr>

    <!-- Formulario con @ModelAttribute -->
    <h2>Registrar Nueva Película</h2>
    <form th:action="@{/peliculas/guardar}" th:object="${nuevaPelicula}" method="post">
        <div>
            <label for="id">ID:</label>
            <input type="number" id="id" th:field="*{id}" required>
        </div>
        <div>
            <label for="titulo">Título:</label>
            <input type="text" id="titulo" th:field="*{titulo}" required>
        </div>
        <div>
            <label for="director">Director:</label>
            <input type="text" id="director" th:field="*{director}" required>
        </div>
        <div>
            <label for="genero">Género:</label>
            <input type="text" id="genero" th:field="*{genero}" required>
        </div>
        <div>
            <button type="submit">Guardar Película</button>
        </div>
    </form>
</body>
</html>
